version: '3.8'

services:
  api:
    build: .
    command: gunicorn api.wsgi:application --bind 0.0.0.0:8000 --workers 3
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - testgen_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - testgen_network

  celery_worker:
    build: .
    command: celery -A api worker --loglevel=info --concurrency=1
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - testgen_network

  celery_beat:
    build: .
    command: celery -A api beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - testgen_network

networks:
  testgen_network:
    driver: bridge
